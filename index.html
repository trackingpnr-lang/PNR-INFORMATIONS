<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyPNR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .fade-in { animation: fadeIn .4s ease; }
    @keyframes fadeIn { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }
    .enter { animation: enter .6s ease; }
    @keyframes enter { from{opacity:0; transform:translateY(20px)} to{opacity:1} }
    .pulse { animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-700 flex flex-col"><!-- sounds --><audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio> <audio id="successSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<!-- header --><header class="p-6 text-white flex justify-between items-center enter">
  <h1 class="text-2xl font-bold tracking-wide">✈️ SkyPNR</h1>
  <span class="text-xs opacity-70">Airline Lookup</span>
</header><!-- main --><main class="flex-1 flex items-center justify-center px-3 sm:px-6">
  <div class="w-full max-w-md md:max-w-lg bg-white/95 backdrop-blur rounded-3xl shadow-2xl p-5 sm:p-8 text-center enter"><h2 class="text-xl sm:text-2xl md:text-3xl font-bold mb-2">Cek Booking</h2>
<p class="text-gray-500 text-sm sm:text-base mb-6">Masukkan kode PNR (6 karakter)</p>

<!-- input -->
<div class="flex flex-col sm:flex-row gap-2">
  <input id="pnr" maxlength="6" placeholder="ABC123"
    oninput="this.value = this.value.toUpperCase()"
    onkeypress="if(event.key==='Enter'){handleSearch()}"
    class="flex-1 border p-3 sm:p-4 rounded-xl text-center tracking-widest uppercase focus:ring-2 focus:ring-blue-500 outline-none text-base sm:text-lg" />
  <button onclick="handleSearch()"
    class="bg-blue-600 text-white px-4 py-3 sm:py-4 rounded-xl text-sm sm:text-base font-semibold hover:bg-blue-700 transition">
    Cari
  </button>
</div>

<!-- loading -->
<div id="loading" class="hidden mt-6 text-blue-600 text-sm sm:text-base pulse">🔎 Mencari data...</div>

<!-- result -->
<div id="result" class="hidden mt-6 text-left fade-in text-sm sm:text-base">
  <div class="bg-gradient-to-r from-gray-100 to-gray-50 p-4 rounded-2xl shadow-inner">
    <p class="font-semibold text-lg" id="r_name"></p>
    <p class="text-sm text-gray-500 mb-2">PNR: <span id="r_pnr"></span></p>
    <hr class="my-2">
    <p><strong>Flight:</strong> <span id="r_flight"></span></p>
    <p><strong>Rute:</strong> <span id="r_route"></span></p>
    <p><strong>Tanggal:</strong> <span id="r_date"></span></p>
    <p class="mt-2"><strong>Status:</strong>
      <span id="r_status" class="text-green-600 font-bold"></span>
    </p>

    <!-- passengers -->
    <div class="mt-3">
      <p class="font-semibold mb-1">Penumpang</p>
      <div id="passengerList"></div>
    </div>
  </div>
</div>

<!-- error -->
<div id="error" class="hidden mt-6 text-red-500 text-sm sm:text-base">❌ PNR tidak ditemukan</div>

<!-- validation -->
<div id="invalid" class="hidden mt-6 text-yellow-500 text-sm">⚠️ PNR harus 6 karakter</div>

  </div>
</main><footer class="text-center text-white text-xs sm:text-sm opacity-70 pb-4">
  © 2026 SkyPNR
</footer><script>
const bookings = [
  {
    pnr:"ABC123",
    passengers:[
      {name:"BUDI RAHMAN", type:"Adult", seat:"12A"},
      {name:"SITI RAHMA", type:"Adult", seat:"12B"}
    ],
    flight:"GA-123",
    route:"CGK → DPS",
    date:"12 Mei 2026",
    status:"Confirmed"
  },
  {
    pnr:"XYZ789",
    passengers:[
      {name:"ANI SARI", type:"Adult", seat:"8C"}
    ],
    flight:"SQ-211",
    route:"SUB → SIN",
    date:"20 Juni 2026",
    status:"Ticketed"
  }
];

function renderPassengers(list){
  return list.map(p=>`
    <div class="flex justify-between border-b py-1 text-sm">
      <span>${p.name} (${p.type})</span>
      <span>${p.seat}</span>
    </div>
  `).join("");
}

function playClick(){ document.getElementById('clickSound').play(); }
function playSuccess(){ document.getElementById('successSound').play(); }
function speak(text){ const msg=new SpeechSynthesisUtterance(text); msg.lang='id-ID'; speechSynthesis.speak(msg); }

function handleSearch(){
  playClick();
  const pnr = document.getElementById('pnr').value.toUpperCase();

  document.getElementById('invalid').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('error').classList.add('hidden');

  if(pnr.length !== 6){
    document.getElementById('invalid').classList.remove('hidden');
    speak('PNR harus enam karakter');
    return;
  }

  document.getElementById('loading').classList.remove('hidden');

  setTimeout(()=>{
    const result = bookings.find(b=>b.pnr===pnr);
    document.getElementById('loading').classList.add('hidden');

    if(result){
      document.getElementById('result').classList.remove('hidden');
      document.getElementById('r_name').innerText = result.passengers[0].name;
      document.getElementById('r_pnr').innerText = result.pnr;
      document.getElementById('r_flight').innerText = result.flight;
      document.getElementById('r_route').innerText = result.route;
      document.getElementById('r_date').innerText = result.date;
      document.getElementById('r_status').innerText = result.status;
      document.getElementById('passengerList').innerHTML = renderPassengers(result.passengers);
      playSuccess();
      speak('Booking ditemukan');
    } else {
      document.getElementById('error').classList.remove('hidden');
      speak('PNR tidak ditemukan');
    }
  }, 800);
}
</script></body>
</html>
