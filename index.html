<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroPass</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url('background.jpg') no-repeat center center fixed;
  background-size: cover;
  color: white;
}

.overlay {
  background: rgba(0, 0, 0, 0.45);
  min-height: 100vh;
  padding: 20px;
  text-align: center;
}

.logo {
  width: 120px;
  margin-top: 30px;
}

.subtitle {
  color: #ddd;
}

.desc {
  font-size: 13px;
  color: #ccc;
  margin-bottom: 25px;
}

input {
  width: 80%;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #aaa;
  background: rgba(255,255,255,0.1);
  color: white;
}

button {
  width: 80%;
  padding: 15px;
  margin-top: 15px;
  border-radius: 10px;
  border: none;
  background: #2d5bff;
  color: white;
}

.card {
  margin-top: 25px;
  background: rgba(30,30,30,0.85);
  padding: 20px;
  border-radius: 15px;
  text-align: left;
}

.valid { color: #00ff88; }
.error { color: red; }
</style>
</head>

<body>

<div class="overlay">

<img src="logo.png" class="logo">

<h1>AeroPass</h1>
<div class="subtitle">Fly Smart, Travel Easy</div>

<h2>Cek penerbangan Anda</h2>
<div class="desc">Sistem ini terhubung ke maskapai dengan data realtime</div>

<input type="text" id="pnr" placeholder="Masukkan kode booking">
<br>
<button onclick="cekPNR()">Cari</button>

<div id="status"></div>
<div id="hasil"></div>

</div>

<script>

// 🔥 DATABASE MANUAL (EDIT DI SINI)
const database = {
  "ABC123": {
    nama: "BUDI RAHMAN",
    flight: "GA-123",
    rute: "CGK → DPS",
    tanggal: "12 Mei 2026",
    status: "Confirmed",
    penumpang: [
      { nama: "BUDI RAHMAN", kursi: "12A" },
      { nama: "SITI RAHMA", kursi: "12B" }
    ]
  },

  "XYZ789": {
    nama: "ANDI SAPUTRA",
    flight: "JT-456",
    rute: "SUB → CGK",
    tanggal: "15 Juni 2026",
    status: "Confirmed",
    penumpang: [
      { nama: "ANDI SAPUTRA", kursi: "8A" }
    ]
  }
};


// 🔍 FUNCTION CEK PNR
function cekPNR() {
  const pnr = document.getElementById("pnr").value.toUpperCase();
  const data = database[pnr];

  const status = document.getElementById("status");
  const hasil = document.getElementById("hasil");

  if (data) {
    status.innerHTML = `<div class="valid">✔ Kode valid</div>`;

    let penumpangHTML = "";
    data.penumpang.forEach(p => {
      penumpangHTML += `<p>${p.nama} - ${p.kursi}</p>`;
    });

    hasil.innerHTML = `
      <div class="card">
        <h3>${data.nama}</h3>
        <p>PNR: ${pnr}</p>
        <hr>
        <p><b>Flight:</b> ${data.flight}</p>
        <p><b>Rute:</b> ${data.rute}</p>
        <p><b>Tanggal:</b> ${data.tanggal}</p>
        <p><b>Status:</b> <span class="valid">${data.status}</span></p>

        <h4>Penumpang</h4>
        ${penumpangHTML}
      </div>
    `;
  } else {
    status.innerHTML = `<div class="error">✖ Kode tidak ditemukan</div>`;
    hasil.innerHTML = "";
  }
}

</script>

</body>
</html>
