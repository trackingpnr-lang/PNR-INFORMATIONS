<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroPass</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url('background.jpg') no-repeat center center fixed;
  background-size: cover;
  color: white;
}

.overlay {
  background: rgba(0, 0, 0, 0.65);
  min-height: 100vh;
  padding: 20px;
  text-align: center;
}

.logo {
  width: 120px;
  margin-top: 30px;
}

h1 {
  margin: 10px 0 5px;
  font-size: 28px;
}

.subtitle {
  color: #ccc;
  margin-bottom: 30px;
}

input {
  width: 80%;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #888;
  background: transparent;
  color: white;
  font-size: 16px;
  margin-top: 10px;
}

button {
  width: 80%;
  padding: 15px;
  margin-top: 15px;
  border-radius: 10px;
  border: none;
  background: #1f3b73;
  color: white;
  font-size: 18px;
}

.card {
  margin-top: 30px;
  background: rgba(40, 40, 40, 0.9);
  padding: 20px;
  border-radius: 15px;
  text-align: left;
}

.green {
  color: #00ff88;
}

.footer {
  margin-top: 30px;
  font-size: 12px;
  color: #aaa;
}
</style>

</head>
<body>

<div class="overlay">

<img src="logo.png" class="logo">

<h1>AeroPass</h1>
<div class="subtitle">Fly Smart, Travel Easy</div>

<h2>Cek Booking</h2>
<p>Masukkan kode PNR</p>

<input type="text" id="pnr" placeholder="ABC123">
<br>
<button onclick="cekPNR()">Cari</button>

<div id="hasil"></div>

<div class="footer">© 2026 AeroPass</div>

</div>

<script>
function cekPNR() {
  var pnr = document.getElementById("pnr").value;
  var hasil = document.getElementById("hasil");

  if (pnr === "ABC123") {
    hasil.innerHTML = `
      <div class="card">
        <h3>BUDI RAHMAN</h3>
        <p>PNR: ${pnr}</p>
        <hr>
        <p><b>Flight:</b> GA-123</p>
        <p><b>Rute:</b> CGK → DPS</p>
        <p><b>Tanggal:</b> 12 Mei 2026</p>
        <p><b>Status:</b> <span class="green">Confirmed</span></p>

        <h4>Penumpang</h4>
        <p>BUDI RAHMAN - 12A</p>
        <p>SITI RAHMA - 12B</p>
      </div>
    `;
  } else {
    hasil.innerHTML = `<p style="color:red;">PNR tidak ditemukan</p>`;
  }
}
</script>

</body>
</html>
