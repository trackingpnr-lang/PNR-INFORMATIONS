<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="SkyTrack Pro" content="width=device-width, initial-scale=1.0">
<title>PNR System</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
.enter{animation:enter .6s ease}
@keyframes enter{from{opacity:0;transform:translateY(20px)}to{opacity:1}}
.fade{animation:fade .4s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pulse{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
</style>
</head>

<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-indigo-700 min-h-screen flex flex-col">

<!-- SOUND -->
<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
<audio id="successSound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<header class="p-5 text-white enter">
  <h1 class="text-xl font-bold">✈️ PNR System</h1>
</header>

<main class="flex-1 flex items-center justify-center px-4">
  <div class="bg-white/95 rounded-3xl shadow-2xl p-6 w-full max-w-md text-center enter">

    <h2 class="text-2xl font-bold mb-2">Cek Booking</h2>
    <p class="text-gray-500 mb-5 text-sm">Masukkan kode PNR</p>

    <div class="flex gap-2">
      <input id="pnr" maxlength="6" placeholder="ABC123"
        class="flex-1 border p-3 rounded-xl text-center uppercase tracking-widest">
      <button onclick="search()"
        class="bg-blue-600 text-white px-4 rounded-xl">Cari</button>
    </div>

    <div id="loading" class="hidden mt-4 pulse text-blue-600">
      🔎 Mencari...
    </div>

    <div id="result" class="hidden mt-5 text-left fade">
      <div class="bg-gray-50 p-4 rounded-xl">

        <p class="font-bold text-lg" id="pnrText"></p>
        <p><b>Flight:</b> <span id="flight"></span></p>
        <p><b>Rute:</b> <span id="route"></span></p>
        <p><b>Tanggal:</b> <span id="date"></span></p>
        <p><b>Status:</b> <span id="status" class="text-green-600"></span></p>

        <div class="mt-3">
          <p class="font-semibold mb-1">Penumpang</p>
          <div id="passengerList"></div>
        </div>

      </div>
    </div>

    <div id="error" class="hidden mt-4 text-red-500">
      ❌ PNR tidak ditemukan
    </div>

  </div>
</main>

<footer class="text-center text-white text-xs pb-4 opacity-70">
© 2026 Demo
</footer>

<script>
// 🔥 DATA (EDIT MANUAL DI SINI)
const data = [
  {
    pnr: "ABC123",
    passengers: [
      { name: "BUDI RAHMAN", type: "Adult", seat: "12A" },
      { name: "SITI RAHMA", type: "Adult", seat: "12B" }
    ],
    flight: "GA-123",
    route: "CGK → DPS",
    date: "12 Mei 2026",
    status: "Confirmed"
  },
  {
    pnr: "XYZ789",
    passengers: [
      { name: "ANI SARI", type: "Adult", seat: "8C" }
    ],
    flight: "SQ-211",
    route: "SUB → SIN",
    date: "20 Juni 2026",
    status: "Ticketed"
  }
];

// render passenger
function renderPassengers(list){
  return list.map(p => `
    <div class="flex justify-between border-b py-1 text-sm">
      <span>${p.name} (${p.type})</span>
      <span>${p.seat}</span>
    </div>
  `).join("");
}

function play(id){
  document.getElementById(id).play();
}

function search(){
  play("clickSound");

  let pnr = document.getElementById("pnr").value.toUpperCase();

  loading.classList.remove("hidden");
  result.classList.add("hidden");
  error.classList.add("hidden");

  setTimeout(()=>{
    let res = data.find(x => x.pnr === pnr);
    loading.classList.add("hidden");

    if(res){
      result.classList.remove("hidden");

      pnrText.innerText = res.pnr;
      flight.innerText = res.flight;
      route.innerText = res.route;
      date.innerText = res.date;
      status.innerText = res.status;

      passengerList.innerHTML = renderPassengers(res.passengers);

      play("successSound");
    } else {
      error.classList.remove("hidden");
    }
  }, 800);
}
</script>

</body>
</html>
