<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroPass</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: #fff;
  text-align: center;
}

/* ANIMASI MASUK */
.fade-in {
  animation: fadeIn 1s ease;
}
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}

/* LOGO */
.logo {
  margin-top: 40px;
}
.logo img {
  width: 100px;
}

/* INPUT */
input {
  width: 80%;
  padding: 15px;
  margin-top: 15px;
  border-radius: 12px;
  border: 1px solid #555;
  background: #111;
  color: #fff;
  font-size: 18px;
  text-align: center;
}

button {
  width: 80%;
  padding: 15px;
  margin-top: 15px;
  border-radius: 12px;
  border: none;
  background: #1e3a8a;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
}

/* LOADING */
#loading {
  display: none;
  margin-top: 20px;
}

/* BOARDING PASS */
.ticket {
  display: none;
  background: linear-gradient(135deg, #1c1c1c, #2a2a2a);
  border-radius: 20px;
  padding: 20px;
  margin: 20px;
  border: 1px dashed #555;
  text-align: left;
}

hr {
  border: 0;
  border-top: 1px dashed #555;
}

/* STATUS */
.status {
  color: #00ff88;
}

/* RESPONSIVE */
@media(min-width:600px){
  .ticket {
    width: 400px;
    margin: 20px auto;
  }
}
</style>
</head>

<body class="fade-in">

<div class="logo">
  <img src="logo.png">
  <h1>AeroPass</h1>
  <p>Fly Smart, Travel Easy</p>
</div>

<h2>Cek Booking</h2>
<p>Masukkan kode PNR</p>

<input type="text" id="pnr" placeholder="ABC123">
<button onclick="cariPNR()">Cari</button>

<div id="loading">🔄 Checking booking...</div>

<!-- HASIL -->
<div class="ticket" id="hasil">
  <h2>BUDI RAHMAN</h2>
  <p>PNR: ABC123</p>
  <hr>
  <p><b>Flight:</b> GA-123</p>
  <p><b>Route:</b> CGK → DPS</p>
  <p><b>Tanggal:</b> 12 Mei 2026</p>
  <p><b>Status:</b> <span class="status">Confirmed</span></p>

  <hr>
  <h3>Penumpang</h3>
  <p>BUDI RAHMAN - 12A</p>
  <p>SITI RAHMA - 12B</p>
</div>

<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<script>
function cariPNR() {
  let pnr = document.getElementById("pnr").value.toUpperCase();

  document.getElementById("clickSound").play();

  document.getElementById("loading").style.display = "block";
  document.getElementById("hasil").style.display = "none";

  setTimeout(() => {
    document.getElementById("loading").style.display = "none";

    if (pnr === "ABC123") {
      document.getElementById("hasil").style.display = "block";
    } else {
      alert("PNR tidak ditemukan");
    }

  }, 1500);
}
</script>

</body>
</html>
