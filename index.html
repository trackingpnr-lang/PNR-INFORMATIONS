<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroPass</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: url('background.jpg') no-repeat center center fixed;
  background-size: cover;
  color: white;
}

/* overlay terang */
.overlay {
  background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5));
  min-height: 100vh;
  padding: 20px;
  text-align: center;
}

/* logo */
.logo {
  width: 110px;
  margin-top: 30px;
}

/* teks */
.subtitle { color: #ddd; }
.desc {
  font-size: 13px;
  color: #eee;
  margin-bottom: 25px;
}

/* input */
input {
  width: 85%;
  padding: 15px;
  border-radius: 12px;
  border: none;
  background: rgba(255,255,255,0.15);
  color: white;
  font-size: 16px;
}

/* tombol */
button {
  width: 85%;
  padding: 15px;
  margin-top: 15px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #2d5bff, #4facfe);
  color: white;
  font-weight: bold;
}

/* status */
.valid { color: #00ff88; margin-top: 15px; }
.error { color: #ff4d4d; margin-top: 15px; }

/* card */
.card {
  margin-top: 25px;
  background: rgba(255,255,255,0.12);
  padding: 20px;
  border-radius: 18px;
  text-align: left;
}

/* footer */
.footer {
  margin-top: 40px;
  font-size: 12px;
  color: #ccc;
}
</style>

</head>
<body>

<div class="overlay">

<img src="logo.png" class="logo">

<h1>AeroPass</h1>
<div class="subtitle">Fly Smart, Travel Easy</div>

<h2>✈️ Cek penerbangan Anda</h2>
<div class="desc">Sistem ini terhubung ke maskapai dengan data realtime</div>

<input type="text" id="pnr" placeholder="Masukkan kode booking">
<br>
<button onclick="cekPNR()">Cari</button>

<div id="status"></div>
<div id="hasil"></div>

<div class="footer">© 2026 AeroPass</div>

</div>

<script>

// AUTO CAPS
document.getElementById("pnr").addEventListener("input", function() {
  this.value = this.value.toUpperCase();
});

// 🔥 DATA PALING MUDAH EDIT
const dataPNR = [

  {
    pnr: "ABC123",
    nama: "ARDI JUMARDI",
    flight: "GA-123",
    rute: "CGK → DPS",
    tanggal: "12 Mei 2026",
    status: "Confirmed",
    penumpang: "BUDI RAHMAN - 12A, SITI RAHMA - 12B"
  },

  {
    pnr: "XYZ789",
    nama: "ANDI SAPUTRA",
    flight: "JT-456",
    rute: "SUB → CGK",
    tanggal: "15 Juni 2026",
    status: "Confirmed",
    penumpang: "ANDI SAPUTRA - 8A"
  }

];

// CEK PNR
function cekPNR() {
  const input = document.getElementById("pnr").value;
  const status = document.getElementById("status");
  const hasil = document.getElementById("hasil");

  const data = dataPNR.find(item => item.pnr === input);

  if (data) {
    status.innerHTML = `<div class="valid">✔ Kode booking valid</div>`;

    hasil.innerHTML = `
      <div class="card">
        <h3>${data.nama}</h3>
        <p>PNR: ${data.pnr}</p>
        <hr>
        <p><b>Flight:</b> ${data.flight}</p>
        <p><b>Rute:</b> ${data.rute}</p>
        <p><b>Tanggal:</b> ${data.tanggal}</p>
        <p><b>Status:</b> <span class="valid">${data.status}</span></p>

        <h4>Penumpang</h4>
        <p>${data.penumpang}</p>
      </div>
    `;
  } else {
    status.innerHTML = `<div class="error">✖ Kode tidak ditemukan</div>`;
    hasil.innerHTML = "";
  }
}

</script>

</body>
</html>
